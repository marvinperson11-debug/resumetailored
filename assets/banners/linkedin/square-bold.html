<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<style>
  .stage{width:1080px;height:1080px;padding:96px 92px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand .mark{width:56px;height:56px;font-size:26px}
  .brand .name{font-size:27px}
  .chip{padding:12px 22px;font-size:19px}
  h1{font-family:var(--serif);font-weight:600;font-size:118px;line-height:.96;letter-spacing:-.03em;
     margin-top:auto;margin-bottom:0}
  .sub{font-size:31px;line-height:1.45;color:var(--muted);font-weight:500;margin-top:40px;max-width:820px}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:56px}
  .feats{display:flex;gap:14px;flex-wrap:wrap}
  .pill{background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:13px 22px;
        font-weight:700;font-size:20px;display:flex;align-items:center;gap:11px;color:var(--ink)}
  .pill svg{width:20px;height:20px}
  .price{font-family:var(--serif);font-weight:600;font-size:24px;color:var(--forest)}
  .price s{color:var(--muted);font-weight:400;opacity:.7}
</style></head>
<body><div class="stage">
  <div class="grain"></div>
  <div class="top">
    <div class="brand"><div class="mark">R</div><div class="name"><b>Resume</b>Tailored <span class="ai">AI</span></div></div>
    <div class="chip"><span class="dot"></span>Powered by Claude</div>
  </div>

  <h1>Tailor your<br>résumé to <span class="hl terra">any job</span><br>in <span class="hl forest">seconds.</span></h1>
  <p class="sub">Paste a job link, get a résumé rewritten to match it — plus a matching cover letter. No credit card.</p>

  <div class="foot">
    <div class="feats">
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#2E7D53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Free &amp; unlimited</span>
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#2E7D53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>ATS-ready</span>
      <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="#2E7D53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Cover letters</span>
    </div>
    <div class="price">Free forever · Pro <s>$29</s> $19.00/mo</div>
  </div>
</div></body></html>

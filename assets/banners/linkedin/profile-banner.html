<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_brand.css">
<style>
  .stage{width:1584px;height:396px;display:flex;align-items:center;
    background:
      radial-gradient(60% 140% at 88% 50%, rgba(46,125,83,.10), transparent 60%),
      radial-gradient(50% 120% at 0% 0%, rgba(180,86,46,.06), transparent 55%),
      var(--cream);}
  /* avatar safe zone marker area = bottom-left ~ 0-320px; keep content centered/right */
  .left{width:430px;flex:none;padding:0 0 0 64px;align-self:flex-start;padding-top:52px}
  .brand .mark{width:50px;height:50px;font-size:23px}
  .brand .name{font-size:24px}
  .divider{width:2px;align-self:stretch;background:var(--border-2);margin:0 8px}
  .mid{flex:1;padding:0 60px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:17px;margin-bottom:16px}
  h1{font-family:var(--serif);font-weight:600;font-size:60px;line-height:1.0;letter-spacing:-.025em}
  h1 em{font-style:italic;color:var(--forest)}
  p{font-size:24px;color:var(--muted);font-weight:500;margin-top:18px}
  .right{width:430px;flex:none;padding-right:70px;display:flex;flex-direction:column;gap:16px;align-items:flex-end}
  .pill{background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:14px 24px;
    font-weight:700;font-size:21px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 22px rgba(25,21,18,.05)}
  .pill svg{width:22px;height:22px;stroke:#2E7D53;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .url{font-size:22px;margin-top:6px}
</style></head>
<body><div class="stage">
  <div class="grain"></div>
  <div class="mid" style="margin-left:360px">
    <div class="eyebrow">Résumé Tailored AI · powered by Claude</div>
    <h1>Tailor your résumé to <em>any job</em> — in seconds.</h1>
    <p>Free &amp; unlimited AI résumé tailoring, ATS scans and cover letters.</p>
  </div>
  <div class="right">
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Free &amp; unlimited</div>
    <div class="pill"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>ATS-ready résumés</div>
    <div class="url">resumetailored.com</div>
  </div>
</div></body></html>

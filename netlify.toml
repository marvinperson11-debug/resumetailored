# Netlify config — builds a preview of the static landing page so changes can
# be viewed before going live. Points the build base at public/ (no package.json
# there) so Netlify skips installing the backend; the site needs no build step.

[build]
  base = "public"
  publish = "."
  command = "echo 'Static site — no build step required.'"

[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200

# Live in-browser video preview (Remotion Player, no server render).
[[redirects]]
  from = "/preview"
  to = "/preview.html"
  status = 200

# /yourname is a placeholder string from the personal-website examples that
# Google mistakenly crawled as a real URL (it 404s). 301 it to the homepage.
[[redirects]]
  from = "/yourname"
  to = "/"
  status = 301

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

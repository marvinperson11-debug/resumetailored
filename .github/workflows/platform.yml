name: Platform checks

# Guards the Next.js platform (resumetailored-platform/): types, lint (including the
# money/date formatting rules), the i18n ratchet + message-catalog parity, the signed-out
# free-tier tests, and a build.
on:
  pull_request:
    branches: [main]
    paths: ["resumetailored-platform/**", ".github/workflows/platform.yml"]
  push:
    branches: [main]
    paths: ["resumetailored-platform/**", ".github/workflows/platform.yml"]

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resumetailored-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: resumetailored-platform/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes Intl money/date rules)
        run: npm run lint

      - name: i18n guard (hard-coded strings ratchet + message parity/ICU)
        run: npm run lint:i18n

      - name: Document pipeline (scrub, DOCX, employer gate, batch ZIP)
        run: npm run test:documents

      - name: Guest free-tier gate (handlers + middleware, in-process)
        run: npm run test:guest-gate

      - name: Guest sign-up nudge (React components in jsdom)
        run: npm run test:guest-nudge

      - name: Build
        run: npm run build

      - name: Guest free-tier over real HTTP (needs the build above)
        run: npm run test:guest-http

name: Smoke PR 639 (production, manual)

# Manually dispatched. Runs the structured-documents smoke scripts against the PRODUCTION Supabase project
# (owner-approved) using ONLY the dedicated test user smoke_pr639 and fake employer names. Every row and
# Storage object it creates is deleted by smoke-staging.cjs itself and again by the final smoke-cleanup.cjs sweep,
# which always runs. Needs repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY.
on:
  # TEMPORARY (owner-approved one-shot): GitHub only registers workflow_dispatch for workflows on the default branch,
  # so this path-filtered push trigger runs the smoke once. Removed again in the very next commit.
  push:
    branches: [claude/structured-documents-pipeline]
    paths: [.github/workflows/smoke-pr639.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-pr639
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: resumetailored-platform
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMOKE_USER_ID: smoke_pr639
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: resumetailored-platform/package-lock.json

      - run: npm ci

      - name: Smoke - real Supabase + Storage + model (creates, then deletes, smoke_pr639 data)
        run: node scripts/smoke-staging.cjs

      - name: Smoke - real model, cover letter + employer gate
        if: ${{ !cancelled() }}
        run: node scripts/smoke-real-model.cjs

      # The batch rows and ZIP are deleted inside smoke-staging.cjs's own finally block, so the per-item errors and
      # _REVIEW_REQUIRED.txt are printed there (DIAG lines) BEFORE that cleanup. This step prints the same lines
      # again in their own section, whichever step failed.
      - name: Echo diagnostics (always runs; per-item errors, review notes, model/gate trace)
        if: ${{ always() }}
        run: |
          if [ -s "$RUNNER_TEMP/smoke-diag.txt" ]; then cat "$RUNNER_TEMP/smoke-diag.txt"; else echo "No diagnostics file: smoke-staging.cjs did not get far enough to write one (see that step's log)."; fi

      - name: Cleanup sweep (always runs; prints the deletion report)
        if: ${{ always() }}
        run: node scripts/smoke-cleanup.cjs

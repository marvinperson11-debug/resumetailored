<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Portal — Manager's Admin Panel | ResumeTailored</title>
<meta name="description" content="Run hiring, people operations, compliance and collaboration from one calm command center.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/luxury-ecosystem.css">
<link rel="stylesheet" href="/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0}body{--navy:#0a1628;--emerald:#1a4d3a;--gold:#c9a227;--ivory:#f5f1e8;background:var(--navy);color:#e9efec;font-family:Inter,Arial,sans-serif;min-height:100vh}
.pt-top{height:66px;display:flex;align-items:center;gap:18px;padding:0 28px;border-bottom:1px solid rgba(201,162,39,.25);background:rgba(10,22,40,.96);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
.pt-top a.pt-brand{color:var(--ivory);text-decoration:none;font:500 20px Fraunces,Georgia,serif}.pt-mark{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.pt-top .pt-co{color:#9eb2aa;font-size:12px;letter-spacing:.04em}.pt-links{display:flex;gap:4px;margin-left:auto}.pt-links a{padding:8px 10px;color:#9eb2aa;text-decoration:none;font-size:11px}.pt-links a:hover{color:var(--ivory)}
.pt-top .pt-role{padding:6px 10px;border:1px solid rgba(201,162,39,.48);color:#e0c45d;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.pt-wrap{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 66px)}
.pt-rail{border-right:1px solid rgba(201,162,39,.16);padding:22px 12px;background:#081422;overflow:auto}.pt-rail::before{content:"MANAGER ADMIN PANEL";display:block;margin:2px 10px 24px;color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.18em}
.pt-rail h3{color:#657b75;font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin:22px 10px 8px}.pt-rail p{line-height:1.6}
.pt-navbtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;color:#b9c8c3;padding:10px 12px;font-size:13px;cursor:pointer;border-radius:3px;transition:.18s}.pt-navbtn:hover{border-color:rgba(201,162,39,.13);background:rgba(255,255,255,.025)}.pt-navbtn.active{border-color:rgba(201,162,39,.2);background:rgba(26,77,58,.52);color:#fff}.pt-navbtn small{display:block;margin-top:3px;color:#718780;font-size:10px}
.pt-main{padding:clamp(28px,5vw,58px);overflow:auto;max-width:1500px;width:100%;margin:0 auto}.pt-h{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px 20px;margin-bottom:28px;border-bottom:1px solid rgba(201,162,39,.13);padding-bottom:22px}.pt-h h1{margin:0;color:var(--ivory);font:500 clamp(32px,4vw,50px)/1 Fraunces,Georgia,serif;letter-spacing:-.025em}.pt-h p{grid-column:1;margin:0;color:#8fa39c;font-size:13px}.pt-h .pt-headbtn{grid-column:2;grid-row:1/3}
.pt-btn{border:1px solid rgba(201,162,39,.6);background:transparent;color:#e1c65d;padding:10px 16px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.pt-btn--solid{background:var(--emerald);border-color:var(--emerald);color:#fff}.pt-btn:hover{background:rgba(201,162,39,.09)}.pt-btn--solid:hover{background:#22634c}
.pt-card{background:#0d1e30;border:1px solid rgba(201,162,39,.14);padding:20px;margin-bottom:14px;border-radius:3px;box-shadow:0 18px 44px rgba(0,0,0,.12)}details.pt-card{padding:0}details.pt-card>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;color:var(--ivory);font:500 16px Fraunces,Georgia,serif;cursor:pointer}details.pt-card>summary::-webkit-details-marker{display:none}details.pt-card>summary::after{content:"+";color:var(--gold);font:400 20px Inter,sans-serif}details.pt-card[open]>summary::after{content:"−"}details.pt-card>.pt-card-body{padding:0 20px 20px;border-top:1px solid rgba(201,162,39,.1)}
.pt-rec{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.045)}.pt-rec:last-child{border-bottom:0}.pt-rec b{color:#edf2ef;font-weight:600}.pt-rec .pt-status{margin-left:auto;padding:5px 9px;border:1px solid rgba(201,162,39,.42);color:#dcc25d;font-size:9px;text-transform:uppercase;letter-spacing:.1em}.pt-rec small{color:#738983}
.pt-field{display:block;margin:12px 0}.pt-field label{display:block;color:#91a49e;font-size:11px;margin-bottom:6px}.pt-field input,.pt-field textarea,.pt-field select{width:100%;padding:12px;border:1px solid rgba(201,162,39,.2);border-radius:2px;background:#081624;color:#e9efec;font-size:13px;font-family:inherit;outline:none}.pt-field input:focus,.pt-field textarea:focus,.pt-field select:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,162,39,.08)}
.pt-grid{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:12px}.pt-kpi{position:relative;min-height:144px;background:#0d1e30;border:1px solid rgba(201,162,39,.14);padding:24px;text-align:left;border-radius:3px;overflow:hidden}.pt-kpi::after{content:"";position:absolute;width:52px;height:52px;border:1px solid rgba(201,162,39,.12);right:-24px;bottom:-24px;transform:rotate(45deg)}.pt-kpi b{display:block;margin-bottom:22px;color:var(--ivory);font:500 38px/1 Fraunces,Georgia,serif}.pt-kpi span{color:#81968f;font-size:9px;text-transform:uppercase;letter-spacing:.13em}
.pt-msg{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.045)}.pt-msg b{color:#dfc55f;font-size:11px}.pt-msg span{color:#c2cfca}.pt-hidden{display:none!important}
.pt-gate{max-width:560px;margin:100px auto;padding:48px;border:1px solid var(--gold);background:#0d1e30;text-align:center}.pt-gate h1{margin:0 0 12px;color:var(--ivory);font:500 44px Fraunces,Georgia,serif}.pt-gate p{color:#94a8a1;line-height:1.7}.pt-gate a{display:inline-block;margin-top:16px;border:1px solid var(--gold);background:var(--gold);color:var(--navy);text-decoration:none;padding:12px 22px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
@media(max-width:920px){.pt-links{display:none}.pt-wrap{grid-template-columns:1fr}.pt-rail{border-right:0;border-bottom:1px solid rgba(201,162,39,.18);max-height:250px}.pt-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.pt-top{padding:0 16px}.pt-main{padding:24px 16px}.pt-grid{grid-template-columns:1fr}.pt-h{grid-template-columns:1fr}.pt-h .pt-headbtn{grid-column:1;grid-row:auto}.pt-role{display:none}}
</style></head><body>
<div class="pt-top"><span class="pt-mark" aria-hidden="true"></span><a class="pt-brand" href="/employer">ResumeTailored</a><span class="pt-co" id="ptCo">The Portal</span><nav class="pt-links" aria-label="Portal links"><a href="/portal">Portal Home</a><a href="/employer">Employer Dashboard</a><a href="/corporate">Employer Plans</a></nav><span class="pt-role" id="ptRole"></span></div>
<div id="ptGate" class="pt-gate pt-hidden"><h1>The Portal</h1><p id="ptGateMsg">Sign in with an employer account to enter the Manager's Admin Panel.</p><a href="/employer" id="ptGateLink">Open the employer portal</a></div>
<div class="pt-wrap pt-hidden" id="ptWrap">
  <aside class="pt-rail" id="ptRail"></aside>
  <main class="pt-main" id="ptMain"></main>
</div>
<script>
(function(){'use strict';
  var token=null; try{token=localStorage.getItem('rt_token');}catch(e){}
  var ctx=null, view={type:'home'};
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function h(json){var x={};if(token)x.Authorization='Bearer '+token;if(json)x['Content-Type']='application/json';return x;}
  function api(method,path,body){return fetch(path,{method:method,headers:h(!!body),credentials:'same-origin',body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){return{status:r.status,j:j};}).catch(function(){return{status:r.status,j:{}};});});}

  function gate(msg){$('ptGate').classList.remove('pt-hidden');$('ptWrap').classList.add('pt-hidden');if(msg)$('ptGateMsg').textContent=msg;}

  function boot(){
    api('GET','/api/portal/context').then(function(res){
      if(res.status===401){gate('Please sign in first.');$('ptGateLink').setAttribute('href','/login');return;}
      if(res.status===403){gate('Create an employer account to use the portal.');return;}
      ctx=res.j;
      $('ptWrap').classList.remove('pt-hidden');$('ptGate').classList.add('pt-hidden');
      $('ptCo').textContent=ctx.companyName||'The Portal';
      $('ptRole').textContent=ctx.role+' · '+ctx.tier;
      renderRail(); go({type:'home'});
    });
  }

  function renderRail(){
    var html='<h3>Overview</h3>';
    html+=navBtn({type:'home'},'Dashboard','Manager analytics');
    if(ctx.collabActive){
      html+='<h3>Collaboration</h3>';
      html+=navBtn({type:'chat'},'Team Chat','Real-time messaging');
      html+=navBtn({type:'directory'},'Directory','People &amp; roles');
      html+=navBtn({type:'calendar'},'Calendar','Company dates');
      if(rankAtLeast('manager'))html+=navBtn({type:'copilot'},'AI Copilot','Ask across modules');
    }
    html+='<h3>Modules ('+ctx.activeModules.length+')</h3>';
    if(!ctx.activeModules.length)html+='<p style="color:#7f9391;font-size:13px;padding:0 10px">No operational modules on this plan. Upgrade to Scale or Corporate.</p>';
    ctx.activeModules.forEach(function(m){html+=navBtn({type:'module',key:m.key},esc(m.name),esc(m.category));});
    if(ctx.role==='admin'){html+='<h3>Administration</h3>';html+=navBtn({type:'members'},'Team &amp; Roles','Seats &amp; permissions');if(ctx.tier==='scale')html+=navBtn({type:'activate'},'Activate Modules',(ctx.scaleRemaining||0)+' of 5 remaining');}
    $('ptRail').innerHTML=html;
    Array.prototype.forEach.call($('ptRail').querySelectorAll('.pt-navbtn'),function(b){b.addEventListener('click',function(){go(JSON.parse(b.getAttribute('data-view')));});});
  }
  function navBtn(v,label,sub){var active=(v.type===view.type&&(v.key||'')===(view.key||''))?' active':'';return '<button class="pt-navbtn'+active+'" data-view=\''+esc(JSON.stringify(v))+'\'>'+label+(sub?'<small>'+sub+'</small>':'')+'</button>';}
  function rankAtLeast(min){var r={admin:3,manager:2,employee:1};return (r[ctx.role]||0)>=(r[min]||0);}

  function go(v){view=v;renderRail();var m=$('ptMain');m.innerHTML='<p style="color:#8ea0a1">Loading…</p>';
    if(v.type==='home')return renderHome(m);
    if(v.type==='module')return renderModule(m,v.key);
    if(v.type==='chat')return renderChat(m);
    if(v.type==='directory')return renderDirectory(m);
    if(v.type==='calendar')return renderCalendar(m);
    if(v.type==='copilot')return renderCopilot(m);
    if(v.type==='members')return renderMembers(m);
    if(v.type==='activate')return renderActivate(m);
  }

  function head(title,sub,btnLabel){return '<div class="pt-h"><div><h1>'+title+'</h1></div><p>'+(sub||'')+'</p>'+(btnLabel?'<button class="pt-btn pt-headbtn" type="button">'+btnLabel+'</button>':'')+'</div>';}

  function renderHome(m){
    if(!rankAtLeast('manager')){m.innerHTML=head('Welcome','Your tools are in the left rail.')+'<div class="pt-card">Select a module to begin. Analytics are available to managers and admins.</div>';return;}
    api('GET','/api/portal/analytics').then(function(res){
      var k=(res.j&&res.j.kpis)||{};
      m.innerHTML=head('Manager Analytics','A calm read on the whole operation.')+
        '<div class="pt-grid">'+
        kpi(k.totalRecords,'Records')+kpi(k.hires,'Hires')+kpi(k.openRequisitions,'Open reqs')+
        kpi(k.openIncidents,'Open incidents')+kpi('$'+(k.pendingExpenseTotal||0),'Pending expenses')+kpi(k.avgPulse!=null?k.avgPulse:'—','Avg pulse')+
        '</div>';
    });
  }
  function kpi(v,l){return '<div class="pt-kpi"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>';}

  function renderModule(m,key){
    api('GET','/api/portal/modules/'+encodeURIComponent(key)+'/records').then(function(res){
      if(res.status!==200){m.innerHTML=head('Unavailable',res.j.message||'This module is not available.');return;}
      var mod=res.j.module,perms=res.j.permissions,recs=res.j.records;
      var html=head(esc(mod.name),(recs.length)+' '+esc(mod.recordLabel).toLowerCase()+(recs.length===1?'':'s'),perms.manage?'Export CSV':'');
      if(perms.write)html+='<details class="pt-card" id="ptForm"><summary>Add '+esc(mod.recordLabel)+'</summary><div class="pt-card-body">'+mod.fields.map(fieldInput).join('')+statusSelect(mod.statuses)+'<button class="pt-btn pt-btn--solid" id="ptAdd" style="margin-top:12px">Add</button></div></details>';
      html+='<details class="pt-card" open><summary>'+esc(mod.name)+' records <small>'+recs.length+'</small></summary><div class="pt-card-body">'+(recs.length?recs.map(function(r){return recRow(r,mod);}).join(''):'<p style="color:#8ea0a1">Nothing here yet.</p>')+'</div></details>';
      m.innerHTML=html;
      Array.prototype.forEach.call(m.querySelectorAll('.pt-headbtn'),function(b){b.addEventListener('click',function(){window.location.href='/api/portal/modules/'+encodeURIComponent(key)+'/export.csv';});});
      if(perms.write&&$('ptAdd'))$('ptAdd').addEventListener('click',function(){addRecord(key,mod);});
    });
  }
  function fieldInput(f){
    var id='ptf_'+f.key;
    if(f.type==='longtext')return '<div class="pt-field"><label>'+esc(f.label)+(f.required?' *':'')+'</label><textarea id="'+id+'" rows="3"></textarea></div>';
    if(f.type==='bool')return '<div class="pt-field"><label><input type="checkbox" id="'+id+'" style="width:auto"> '+esc(f.label)+'</label></div>';
    var t=f.type==='number'?'number':(f.type==='date'?'date':(f.type==='datetime'?'datetime-local':'text'));
    return '<div class="pt-field"><label>'+esc(f.label)+(f.required?' *':'')+'</label><input type="'+t+'" id="'+id+'"></div>';
  }
  function statusSelect(statuses){return '<div class="pt-field"><label>Status</label><select id="ptf_status">'+statuses.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join('')+'</select></div>';}
  function recRow(r,mod){var sub=Object.keys(r.data||{}).filter(function(k){return k!=='title'&&r.data[k]!==''&&r.data[k]!=null;}).slice(0,2).map(function(k){return esc(r.data[k]);}).join(' · ');return '<div class="pt-rec"><div><b>'+esc(r.title)+'</b>'+(sub?'<br><small>'+sub+'</small>':'')+'</div><span class="pt-status">'+esc(r.status)+'</span></div>';}
  function addRecord(key,mod){
    var body={};mod.fields.forEach(function(f){var el=$('ptf_'+f.key);if(!el)return;body[f.key]=f.type==='bool'?el.checked:el.value;});
    var st=$('ptf_status');if(st)body.status=st.value;
    api('POST','/api/portal/modules/'+encodeURIComponent(key)+'/records',body).then(function(res){
      if(res.status!==200){alert((res.j.messages&&res.j.messages.join('\n'))||res.j.message||'Could not save.');return;}
      go({type:'module',key:key});
    });
  }

  function renderChat(m){
    m.innerHTML=head('Team Chat','Fast, focused company conversations.')+'<div class="pt-card" id="ptMsgs">…</div><div class="pt-field"><input id="ptChatInput" placeholder="Message your team…"></div><button class="pt-btn pt-btn--solid" id="ptChatSend">Send</button>';
    loadChat();
    $('ptChatSend').addEventListener('click',sendChat);
    $('ptChatInput').addEventListener('keydown',function(e){if(e.key==='Enter')sendChat();});
  }
  function loadChat(){api('GET','/api/portal/chat').then(function(res){var msgs=(res.j&&res.j.messages)||[];$('ptMsgs').innerHTML=msgs.length?msgs.map(function(x){return '<div class="pt-msg"><b>'+esc(x.created_by)+'</b> <span>'+esc(x.body)+'</span></div>';}).join(''):'<p style="color:#8ea0a1">No messages yet.</p>';});}
  function sendChat(){var v=$('ptChatInput').value.trim();if(!v)return;$('ptChatInput').value='';api('POST','/api/portal/chat',{body:v}).then(loadChat);}

  function renderDirectory(m){api('GET','/api/portal/directory').then(function(res){var d=(res.j&&res.j.directory)||[];m.innerHTML=head('Employee Directory','Roles, teams and contact context.')+'<div class="pt-card">'+d.map(function(p){return '<div class="pt-rec"><div><b>'+esc(p.name||p.email)+'</b><br><small>'+esc(p.email)+'</small></div><span class="pt-status">'+esc(p.role)+'</span></div>';}).join('')+'</div>';});}

  function renderCalendar(m){
    api('GET','/api/portal/calendar').then(function(res){
      var items=(res.j&&res.j.items)||[];
      var html=head('Company Calendar','People and operational dates together.');
      if(rankAtLeast('manager'))html+='<details class="pt-card"><summary>Add company event</summary><div class="pt-card-body"><div class="pt-field"><label>Event</label><input id="ptCalTitle"></div><div class="pt-field"><label>Date</label><input id="ptCalAt" type="datetime-local"></div><button class="pt-btn pt-btn--solid" id="ptCalAdd">Add event</button></div></details>';
      html+='<details class="pt-card" open><summary>Upcoming dates <small>'+items.length+'</small></summary><div class="pt-card-body">'+(items.length?items.map(function(x){return '<div class="pt-rec"><b>'+esc(x.title)+'</b><span class="pt-status">'+(x.at?new Date(x.at).toLocaleDateString():'—')+'</span></div>';}).join(''):'<p style="color:#8ea0a1">No events.</p>')+'</div></details>';
      m.innerHTML=html;
      if($('ptCalAdd'))$('ptCalAdd').addEventListener('click',function(){var t=$('ptCalTitle').value.trim();if(!t)return;var at=$('ptCalAt').value?new Date($('ptCalAt').value).getTime():null;api('POST','/api/portal/calendar',{title:t,at:at}).then(function(){go({type:'calendar'});});});
    });
  }

  function renderCopilot(m){
    m.innerHTML=head('Cross-Module AI Copilot','Answers and drafts across your whole operation.')+'<div class="pt-field"><input id="ptCopQ" placeholder="e.g. How are we doing on hiring and incidents?"></div><button class="pt-btn pt-btn--solid" id="ptCopAsk">Ask</button><div class="pt-card pt-hidden" id="ptCopA" style="margin-top:16px"></div>';
    $('ptCopAsk').addEventListener('click',function(){var q=$('ptCopQ').value.trim();if(!q)return;$('ptCopA').classList.remove('pt-hidden');$('ptCopA').textContent='Thinking…';api('POST','/api/portal/copilot',{question:q}).then(function(res){$('ptCopA').textContent=(res.j&&res.j.answer)||'No answer.';});});
  }

  function renderMembers(m){
    api('GET','/api/portal/members').then(function(res){
      var members=(res.j&&res.j.members)||[];
      var html=head('Team &amp; Roles','Admins manage the company; managers run operations; employees submit their own.','','');
      html+='<details class="pt-card"><summary>Invite a team member</summary><div class="pt-card-body"><div class="pt-field"><label>Email</label><input id="ptMemEmail"></div><div class="pt-field"><label>Name</label><input id="ptMemName"></div><div class="pt-field"><label>Role</label><select id="ptMemRole"><option value="employee">Employee</option><option value="manager">Manager</option><option value="admin">Admin</option></select></div><button class="pt-btn pt-btn--solid" id="ptMemAdd">Invite member</button></div></details>';
      html+='<details class="pt-card" open><summary>Current team <small>'+members.length+'</small></summary><div class="pt-card-body">'+(members.length?members.map(function(x){return '<div class="pt-rec"><div><b>'+esc(x.name||x.email)+'</b><br><small>'+esc(x.email)+'</small></div><span class="pt-status">'+esc(x.role)+'</span></div>';}).join(''):'<p style="color:#8ea0a1">No members yet.</p>')+'</div></details>';
      m.innerHTML=html;
      $('ptMemAdd').addEventListener('click',function(){var e=$('ptMemEmail').value.trim();if(!e)return;api('POST','/api/portal/members',{email:e,name:$('ptMemName').value.trim(),role:$('ptMemRole').value}).then(function(res){if(res.status!==200){alert(res.j.message||'Could not add member.');return;}go({type:'members'});});});
    });
  }

  function renderActivate(m){
    var html=head('Activate Modules',(ctx.scaleRemaining||0)+' of 5 remaining. Choices are permanent on Scale.','','');
    html+='<details class="pt-card" open><summary>Module collection</summary><div class="pt-card-body">'+ctx.allModules.map(function(mod){return '<div class="pt-rec"><div><b>'+esc(mod.name)+'</b><br><small>'+esc(mod.category)+'</small></div>'+(mod.active?'<span class="pt-status">Active</span>':'<button class="pt-btn pt-act" type="button" data-act="'+esc(mod.key)+'">Activate</button>')+'</div>';}).join('')+'</div></details>';
    m.innerHTML=html;
    Array.prototype.forEach.call(m.querySelectorAll('.pt-act'),function(b){b.addEventListener('click',function(){api('POST','/api/portal/modules/activate',{moduleKey:b.getAttribute('data-act')}).then(function(res){if(res.status!==200){alert(res.j.message||'Could not activate.');return;}boot();});});});
  }

  boot();
})();
</script><script src="/back-nav.js?v=1"></script>
</body></html>
